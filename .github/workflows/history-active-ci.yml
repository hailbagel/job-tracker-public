name: Historical job status regression

on:
  pull_request:
    paths:
      - 'jobtracker/processing.py'
      - 'tests/test_history_active_consistency.py'
      - '.github/workflows/history-active-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Run history regression tests
        run: python -m unittest discover -s tests -p test_history_active_consistency.py -v
      - name: Run full project regression suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify code syntax and patch whitespace
        run: |
          python -m compileall -q jobtracker/processing.py tests/test_history_active_consistency.py
          git diff --check
      - name: Confirm no production deployment
        run: echo "Code/tests only; no Hostinger services or public datasets were modified."
