[Service]
StateDirectory=vutrulabs-job-tracker-public
StateDirectoryMode=0700
Environment=JOB_TRACKER_SCHEDULER_STATE=/var/lib/vutrulabs-job-tracker-public/state.json
ExecCondition=/usr/bin/python3 /opt/vutrulabs/job-tracker-public/scripts/hostinger_scheduler_state.py eligible --state-file /var/lib/vutrulabs-job-tracker-public/state.json
ExecStopPost=/usr/bin/python3 /opt/vutrulabs/job-tracker-public/scripts/hostinger_scheduler_state.py record-outcome --state-file /var/lib/vutrulabs-job-tracker-public/state.json --service-result=${SERVICE_RESULT} --invocation-id=${INVOCATION_ID}
